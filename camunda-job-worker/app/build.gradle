plugins {
    id 'application'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.camunda:camunda-spring-boot-starter:8.10.0-alpha3'
    implementation 'com.google.protobuf:protobuf-java:4.35.0'
    implementation 'com.google.protobuf:protobuf-java-util:4.35.0'
    compileOnly 'org.projectlombok:lombok'
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    annotationProcessor 'org.projectlombok:lombok'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'net.patrykdobrowolski.camundaworker.CamundaJobWorkerApplication'
}

tasks.named('test') {
    useJUnitPlatform()
}