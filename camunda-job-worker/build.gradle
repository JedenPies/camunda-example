plugins {
    id 'application'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {

    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.2')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'io.camunda:camunda-spring-boot-starter:8.9.12'
    implementation 'com.google.protobuf:protobuf-java:4.35.0'
    implementation 'com.google.protobuf:protobuf-java-util:4.35.0'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:5.0.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    compileOnly 'org.projectlombok:lombok'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    annotationProcessor 'org.projectlombok:lombok'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

application {
    mainClass = 'net.patrykdobrowolski.camundaworker.CamundaJobWorkerApplication'
}

tasks.named('test') {
    useJUnitPlatform()
}